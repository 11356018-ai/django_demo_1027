{% extends 'base.html' %}

{% block title %}登入 - 選課系統{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 400px;
        margin: 3rem auto;
    }
    .login-card {
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        overflow: hidden;
    }
    .login-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 2rem;
        text-align: center;
    }
    .login-header h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
    }
    .login-body {
        padding: 2rem;
    }
    .form-group {
        margin-bottom: 1.25rem;
    }
    .form-group label {
        display: block;
        margin-bottom: 0.5rem;
        color: #2d3748;
        font-weight: 600;
    }
    .form-group input {
        width: 100%;
        padding: 0.625rem;
        border: 1px solid #cbd5e0;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: inherit;
    }
    .form-group input:focus {
        outline: none;
        border-color: #667eea;
    }
    .btn-login {
        width: 100%;
        padding: 0.75rem;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        transition: opacity 0.2s;
    }
    .btn-login:hover {
        opacity: 0.9;
    }
    .errorlist {
        list-style: none;
        color: #e53e3e;
        margin-bottom: 1rem;
        font-size: 0.875rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>🎓 學生登入</h1>
            <p>請輸入帳號密碼以進行選課</p>
        </div>
        <div class="login-body">
            {% if form.errors %}
            <ul class="errorlist">
                <li>帳號或密碼錯誤，請重新輸入。</li>
            </ul>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="form-group">
                    <label for="id_username">使用者名稱</label>
                    {{ form.username }}
                </div>
                <div class="form-group">
                    <label for="id_password">密碼</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn-login">登入</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
